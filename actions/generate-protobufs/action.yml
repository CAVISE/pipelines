name: Generate Protobufs
description: Generate Python protobuf modules directly or through a CMake project.

inputs:
  generator:
    description: Protobuf generator, one of protoc, grpc-tools, or cmake.
    required: false
    default: protoc
  source-dir:
    description: Directory containing .proto files.
    required: false
    default: ""
  output-dir:
    description: Directory for generated protobuf Python files.
    required: false
    default: ""
  messages:
    description: JSON array of protobuf message base names without .proto.
    required: false
    default: "[]"
  mypy-out:
    description: Whether to generate mypy protobuf stubs.
    required: false
    default: "false"
  working-directory:
    description: Directory where generation runs.
    required: false
    default: .
  protoc-version:
    description: Exact protoc release used by the CMake generator.
    required: false
    default: "34.1"
  cmake-source-dir:
    description: CMake source directory, relative to working-directory.
    required: false
    default: .
  cmake-build-dir:
    description: CMake build directory, relative to working-directory.
    required: false
    default: build/protobuf
  cmake-configure-preset:
    description: Named CMake configure preset used for protobuf generation.
    required: false
    default: protobuf
  cmake-build-preset:
    description: Named CMake build preset used for protobuf generation.
    required: false
    default: protobuf
  cmake-install-prefix:
    description: CMake installation prefix, relative to working-directory.
    required: false
    default: .
  cmake-artifact-manifest:
    description: Manifest generated under cmake-install-prefix.
    required: false
    default: protobuf-artifacts.manifest

runs:
  using: composite
  steps:
    - name: Generate with protoc
      if: inputs.generator == 'protoc'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROTOBUF_MESSAGES: ${{ inputs.messages }}
        PROTOBUF_MYPY_OUT: ${{ inputs.mypy-out }}
        PROTOBUF_OUTPUT_DIR: ${{ inputs.output-dir }}
        PROTOBUF_SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        mkdir -p "$PROTOBUF_OUTPUT_DIR"
        command -v protoc
        protoc --version

        proto_files=$(python -c 'import json, os, pathlib; source = pathlib.Path(os.environ["PROTOBUF_SOURCE_DIR"]); print(" ".join(str(source / f"{name}.proto") for name in json.loads(os.environ["PROTOBUF_MESSAGES"])))')
        args=("--proto_path=$PROTOBUF_SOURCE_DIR" "--python_out=$PROTOBUF_OUTPUT_DIR")
        if [[ "$PROTOBUF_MYPY_OUT" == "true" ]]; then
          args+=("--mypy_out=$PROTOBUF_OUTPUT_DIR")
        fi

        protoc "${args[@]}" $proto_files

    - name: Generate with grpc_tools.protoc
      if: inputs.generator == 'grpc-tools'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROTOBUF_MESSAGES: ${{ inputs.messages }}
        PROTOBUF_MYPY_OUT: ${{ inputs.mypy-out }}
        PROTOBUF_OUTPUT_DIR: ${{ inputs.output-dir }}
        PROTOBUF_SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        mkdir -p "$PROTOBUF_OUTPUT_DIR"
        proto_files=$(python -c 'import json, os, pathlib; source = pathlib.Path(os.environ["PROTOBUF_SOURCE_DIR"]); print(" ".join(str(source / f"{name}.proto") for name in json.loads(os.environ["PROTOBUF_MESSAGES"])))')
        args=("-I" "$PROTOBUF_SOURCE_DIR" "--python_out=$PROTOBUF_OUTPUT_DIR")
        if [[ "$PROTOBUF_MYPY_OUT" == "true" ]]; then
          args+=("--mypy_out=$PROTOBUF_OUTPUT_DIR")
        fi

        python -m grpc_tools.protoc "${args[@]}" $proto_files

    - name: Generate with CMake
      if: inputs.generator == 'cmake'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CMAKE_ARTIFACT_MANIFEST: ${{ inputs.cmake-artifact-manifest }}
        CMAKE_BUILD_DIR: ${{ inputs.cmake-build-dir }}
        CMAKE_BUILD_PRESET: ${{ inputs.cmake-build-preset }}
        CMAKE_CONFIGURE_PRESET: ${{ inputs.cmake-configure-preset }}
        CMAKE_INSTALL_PREFIX: ${{ inputs.cmake-install-prefix }}
        CMAKE_SOURCE_DIR: ${{ inputs.cmake-source-dir }}
        PROTOC_VERSION: ${{ inputs.protoc-version }}
      run: |
        protoc_root="$RUNNER_TEMP/protoc-$PROTOC_VERSION"
        protoc_archive="$RUNNER_TEMP/protoc-$PROTOC_VERSION.zip"
        curl --fail --location --show-error \
          --output "$protoc_archive" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
        mkdir -p "$protoc_root"
        unzip -qo "$protoc_archive" -d "$protoc_root"
        export PATH="$protoc_root/bin:$PATH"

        install_prefix="$(realpath -m "$CMAKE_INSTALL_PREFIX")"

        (
          cd "$CMAKE_SOURCE_DIR"
          cmake --preset "$CMAKE_CONFIGURE_PRESET"
          cmake --build --preset "$CMAKE_BUILD_PRESET"
        )
        cmake --install "$CMAKE_BUILD_DIR" --prefix "$install_prefix"

        manifest="$install_prefix/$CMAKE_ARTIFACT_MANIFEST"
        if [[ ! -s "$manifest" ]]; then
          echo "Protobuf artifact manifest is missing or empty: $manifest" >&2
          exit 1
        fi

        while IFS= read -r artifact; do
          if [[ -n "$artifact" ]]; then
            test -f "$install_prefix/$artifact"
          fi
        done < "$manifest"
