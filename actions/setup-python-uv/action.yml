name: Setup Python uv
description: Set up a pinned uv version, Python, and the shared uv cache.

inputs:
  python-version:
    description: Python version selected by uv.
    required: true
  uv-version:
    description: Exact uv version or setup-uv version selector.
    required: false
    default: latest-known
  working-directory:
    description: Directory containing the uv project and lockfile.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup uv and Python
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock
