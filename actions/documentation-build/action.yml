name: Documentation Build
description: Builds one or more localized Sphinx sites for GitHub Pages.

inputs:
  python-version:
    description: Python version used for the documentation build.
    required: false
    default: "3.12"
  docs-directory:
    description: Path to the documentation root containing requirements.txt and the Sphinx source tree.
    required: false
    default: "."
  requirements-file:
    description: Path to the Python requirements file relative to docs-directory.
    required: false
    default: "requirements.txt"
  source-directory:
    description: Path to the Sphinx source directory relative to docs-directory.
    required: false
    default: "source"
  build-directory:
    description: Path to the Sphinx build directory relative to docs-directory.
    required: false
    default: "build"
  languages:
    description: Comma-separated Sphinx language codes to build.
    required: false
    default: "en"
  default-language:
    description: Language published at the site root; other languages are placed in subdirectories.
    required: false
    default: "en"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install documentation dependencies
      shell: bash
      working-directory: ${{ inputs.docs-directory }}
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$REQUIREMENTS_FILE" --no-cache-dir

    - name: Build localized HTML documentation
      shell: bash
      working-directory: ${{ inputs.docs-directory }}
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        BUILD_DIRECTORY: ${{ inputs.build-directory }}
        LANGUAGES: ${{ inputs.languages }}
        DEFAULT_LANGUAGE: ${{ inputs.default-language }}
      run: |
        bash "$GITHUB_ACTION_PATH/build.sh"
