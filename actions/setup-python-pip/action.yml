name: Setup Python Pip
description: Set up Python, enable pip cache, upgrade pip, and optionally install a requirements file.

inputs:
  python-version:
    description: Python version passed to actions/setup-python.
    required: true
  cache-dependency-path:
    description: Dependency files used as pip cache keys.
    required: false
    default: ""
  requirements-file:
    description: Requirements file installed with pip.
    required: false
    default: ""
  working-directory:
    description: Directory where pip commands run.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Upgrade pip
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip install --upgrade pip

    - name: Install requirements
      if: inputs.requirements-file != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: python -m pip install -r "$REQUIREMENTS_FILE"
