name: Python CMake CUDA

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 60
      container-image:
        description: Digest-pinned CUDA development container.
        type: string
        default: nvidia/cuda:13.0.3-devel-ubuntu24.04@sha256:b7ae301dea2c162444795462ce17a05f6a516e5a75944b57af5b88540a1a2266
      requirements-file:
        description: Python requirements needed to configure and build.
        type: string
        required: true
      working-directory:
        description: Caller repository directory containing the CMake project.
        type: string
        default: .
      cmake-source-dir:
        description: CMake source directory, relative to working-directory.
        type: string
        default: .
      cmake-build-dir:
        description: CMake build directory, relative to working-directory.
        type: string
        default: build/cuda
      cmake-configure-preset:
        description: Named CMake configure preset used for the CUDA build.
        type: string
        default: cuda
      cmake-build-preset:
        description: Named CMake build preset used for the CUDA build.
        type: string
        default: cuda
      cuda-architectures:
        description: Value passed to CMAKE_CUDA_ARCHITECTURES.
        type: string
        default: "86"
      artifact-manifest:
        description: Artifact manifest generated by cmake --install.
        type: string
        default: cuda-artifacts.manifest
      pythonpath-subdir:
        description: Installed subdirectory prepended to PYTHONPATH.
        type: string
        default: ""
      python-import-modules:
        description: JSON array of Python modules imported after the build.
        type: string
        default: "[]"

jobs:
  cuda:
    name: CUDA extensions
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    container:
      image: ${{ inputs.container-image }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates=20260601~24.04.* \
            python3=3.12.* \
            python3-dev=3.12.* \
            python3-venv=3.12.*
          rm -rf /var/lib/apt/lists/*

      - name: Install Python build dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          python3 -m venv /opt/python-cmake-cuda
          /opt/python-cmake-cuda/bin/python -m pip install --no-cache-dir \
            cmake==4.2.3 \
            ninja==1.13.0 \
            -r "$REQUIREMENTS_FILE"
          echo "/opt/python-cmake-cuda/bin" >> "$GITHUB_PATH"

      - name: Configure and build CUDA extensions
        working-directory: ${{ inputs.working-directory }}
        env:
          CMAKE_BUILD_DIR: ${{ inputs.cmake-build-dir }}
          CMAKE_BUILD_PRESET: ${{ inputs.cmake-build-preset }}
          CMAKE_CONFIGURE_PRESET: ${{ inputs.cmake-configure-preset }}
          CMAKE_SOURCE_DIR: ${{ inputs.cmake-source-dir }}
          CUDA_ARCHITECTURES: ${{ inputs.cuda-architectures }}
        run: |
          (
            cd "$CMAKE_SOURCE_DIR"
            /opt/python-cmake-cuda/bin/cmake \
            --preset "$CMAKE_CONFIGURE_PRESET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHITECTURES" \
            -DPython3_EXECUTABLE=/opt/python-cmake-cuda/bin/python
            /opt/python-cmake-cuda/bin/cmake \
              --build \
              --preset "$CMAKE_BUILD_PRESET"
          )
          /opt/python-cmake-cuda/bin/cmake --install "$CMAKE_BUILD_DIR" \
            --prefix "$RUNNER_TEMP/python-cmake-cuda-install"

      - name: Verify CUDA artifacts
        working-directory: ${{ inputs.working-directory }}
        env:
          ARTIFACT_MANIFEST: ${{ inputs.artifact-manifest }}
          PYTHON_IMPORT_MODULES: ${{ inputs.python-import-modules }}
          PYTHONPATH_SUBDIR: ${{ inputs.pythonpath-subdir }}
        run: |
          install_prefix="$RUNNER_TEMP/python-cmake-cuda-install"
          manifest="$install_prefix/$ARTIFACT_MANIFEST"
          if [[ ! -s "$manifest" ]]; then
            echo "CUDA artifact manifest is missing or empty: $manifest" >&2
            exit 1
          fi

          while IFS= read -r artifact; do
            if [[ -n "$artifact" ]]; then
              test -f "$install_prefix/$artifact"
            fi
          done < "$manifest"

          if [[ -n "$PYTHONPATH_SUBDIR" ]]; then
            export PYTHONPATH="$install_prefix/$PYTHONPATH_SUBDIR${PYTHONPATH:+:$PYTHONPATH}"
          fi

          /opt/python-cmake-cuda/bin/python - <<'PY'
          import importlib
          import json
          import os

          module_names = json.loads(os.environ["PYTHON_IMPORT_MODULES"])
          modules = [importlib.import_module(name) for name in module_names]
          print("Loaded CUDA extensions:", ", ".join(module.__name__ for module in modules))
          PY
