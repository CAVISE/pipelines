name: Python Ruff

"on":
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label.
        type: string
        default: ubuntu-latest
      run-lint:
        description: Whether to run ruff check.
        type: boolean
        default: true
      run-format-check:
        description: Whether to run ruff format --check --diff.
        type: boolean
        default: true

jobs:
  lint:
    if: inputs.run-lint
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

  format-check:
    if: inputs.run-format-check
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run ruff format check with diff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
