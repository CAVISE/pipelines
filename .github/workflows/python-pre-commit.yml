name: Python Pre-Commit

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label.
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version passed to actions/setup-python.
        type: string
        default: "3.12"
      go-version-file:
        description: Optional Go version file; leave empty to skip Go setup.
        type: string
        default: ""
      skip-hooks:
        description: Comma-separated pre-commit hook IDs passed through SKIP.
        type: string
        default: ""
      all-files:
        description: Whether to run pre-commit against all files.
        type: boolean
        default: true

jobs:
  pre-commit:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        if: ${{ inputs.go-version-file != '' }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.go-version-file }}

      - name: Setup Python
        uses: CAVISE/pipelines/actions/setup-python-pip@main
        with:
          python-version: ${{ inputs.python-version }}
          cache-dependency-path: .pre-commit-config.yaml

      - name: Run pre-commit on all files
        if: inputs.all-files
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: ${{ inputs.skip-hooks }}
        with:
          extra_args: >-
            --all-files

      - name: Run pre-commit
        if: ${{ !inputs.all-files }}
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: ${{ inputs.skip-hooks }}
