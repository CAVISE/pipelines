name: Python uv Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Dependency audit timeout in minutes.
        type: number
        default: 15
      python-version:
        description: Python version used to resolve environment markers.
        type: string
        default: "3.12"
      uv-version:
        description: Exact uv version or setup-uv version selector.
        type: string
        default: latest-known
      working-directory:
        description: Directory containing pyproject.toml and uv.lock.
        type: string
        default: .

jobs:
  dependency-audit:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python and uv
        uses: CAVISE/pipelines/actions/setup-python-uv@main
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Audit locked dependencies
        working-directory: ${{ inputs.working-directory }}
        run: uv audit --locked --preview-features audit-command
