name: Semgrep

on:
  workflow_call:
    inputs:
      config:
        description: "Semgrep config passed to --config."
        type: string
        default: auto
      target:
        description: "Target path for Semgrep scan."
        type: string
        default: "."
      extra-args:
        description: 'Additional Semgrep CLI arguments as a JSON array of strings, e.g. ["--verbose", "--timeout", "60"].'
        type: string
        default: "[]"
      fail-on-findings:
        description: "Fail when findings are detected by adding --error."
        type: boolean
        default: false
      runs-on:
        description: "Runner label for the Semgrep job."
        type: string
        default: ubuntu-24.04
      semgrep-image:
        description: "Docker image reference used to run Semgrep."
        type: string
        default: semgrep/semgrep:1.163.0-nonroot
      checkout-fetch-depth:
        description: "Fetch depth passed to actions/checkout."
        type: number
        default: 0
      timeout-minutes:
        description: "Job timeout in minutes."
        type: number
        default: 30
      skip-dependabot:
        description: "Skip scans triggered by dependabot[bot] to avoid permission issues."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !inputs.skip-dependabot || github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.checkout-fetch-depth }}

      - name: Run Semgrep scan
        uses: actions/github-script@v9
        env:
          SEMGREP_IMAGE: ${{ inputs.semgrep-image }}
          SEMGREP_CONFIG: ${{ inputs.config }}
          SEMGREP_TARGET: ${{ inputs.target }}
          SEMGREP_EXTRA_ARGS: ${{ inputs.extra-args }}
          SEMGREP_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        with:
          script: |
            const extraArgs = JSON.parse(process.env.SEMGREP_EXTRA_ARGS);
            if (!Array.isArray(extraArgs) || !extraArgs.every(arg => typeof arg === 'string')) {
              throw new Error('extra-args must be a JSON array of strings.');
            }

            const args = [
              'run', '--rm',
              '--user', `${process.getuid()}:${process.getgid()}`,
              '--volume', `${process.env.GITHUB_WORKSPACE}:/src:ro`,
              '--workdir', '/src',
              '--env', 'HOME=/tmp',
              '--', process.env.SEMGREP_IMAGE,
              'semgrep', 'scan',
              `--config=${process.env.SEMGREP_CONFIG}`,
              ...extraArgs,
            ];
            if (process.env.SEMGREP_FAIL_ON_FINDINGS === 'true') {
              args.push('--error');
            }
            args.push('--', process.env.SEMGREP_TARGET);
            await exec.exec('docker', args);
