name: Secrets scan

on:
  workflow_call:
    inputs:
      target:
        description: "File or directory to scan, relative to the repository root."
        type: string
        default: "."
      gitleaks-config:
        description: "Optional Gitleaks config file, relative to the repository root."
        type: string
        default: ""
      trufflehog-exclude-paths:
        description: "Optional file of newline-separated exclusion regexes, relative to the repository root."
        type: string
        default: ""
      trufflehog-image:
        description: "Docker image used to run TruffleHog."
        type: string
        default: ghcr.io/trufflesecurity/trufflehog:3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
      gitleaks-image:
        description: "Docker image used to run Gitleaks."
        type: string
        default: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      runs-on:
        description: "Linux x64 runner label. The runner must provide Docker."
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: "Timeout for each scanner job, including checkout and image download."
        type: number
        default: 15
      skip-dependabot:
        description: "Skip checks triggered by dependabot[bot]."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.trufflehog-image }}
    if: ${{ !inputs.skip-dependabot || github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Scan for secrets
        env:
          TRUFFLEHOG_EXCLUDE_PATHS: ${{ inputs.trufflehog-exclude-paths }}
          SCAN_TARGET: ${{ inputs.target }}
        run: >-
          trufflehog filesystem
          --no-verification --no-update --no-color --github-actions
          --fail --fail-on-scan-errors
          --exclude-paths="$TRUFFLEHOG_EXCLUDE_PATHS"
          -- "$SCAN_TARGET"

  gitleaks:
    name: Gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.gitleaks-image }}
    if: ${{ !inputs.skip-dependabot || github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Scan for secrets
        env:
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
          SCAN_TARGET: ${{ inputs.target }}
        run: >-
          gitleaks dir
          --redact=100 --verbose --no-banner --no-color
          --config="$GITLEAKS_CONFIG"
          -- "$SCAN_TARGET"
